name: Stale Issues
on:
  schedule:
    - cron: '0 0 * * *'
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93  # v11.0.0
        with:
          stale-issue-message: 'Marked stale due to inactivity. Closes in 7 days.'
          days-before-stale: 30
          days-before-close: 7
